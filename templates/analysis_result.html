<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }
        .chart {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Crime Analysis Dashboard</h1>
    <div class="chart-container">
        <div class="chart">
            <canvas id="cityChart"></canvas>
        </div>
        <div class="chart">
            <canvas id="monthlyChart"></canvas>
        </div>
        <div class="chart">
            <canvas id="nationalityChart"></canvas>
        </div>
        <div class="chart">
            <canvas id="locationChart"></canvas>
        </div>
    </div>

    <script>
        const cityData = {{ city_data|safe }};
        const monthlyData = {{ monthly_data|safe }};
        const nationalityData = {{ nationality_data|safe }};
        const locationData = {{ location_data|safe }};

        new Chart(document.getElementById('cityChart'), {
            type: 'pie',
            data: {
                labels: cityData.map(row => row.city),
                datasets: [{
                    label: 'Crimes by City',
                    data: cityData.map(row => row.count),
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)',
                        'rgba(54, 162, 235, 0.7)',
                        'rgba(255, 206, 86, 0.7)',
                        'rgba(75, 192, 192, 0.7)',
                        'rgba(153, 102, 255, 0.7)',
                        'rgba(255, 159, 64, 0.7)'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Crime Distribution by City'
                    }
                }
            }
        });

        new Chart(document.getElementById('monthlyChart'), {
            type: 'line',
            data: {
                labels: monthlyData.map(row => row.month),
                datasets: [{
                    label: 'Crimes per Month',
                    data: monthlyData.map(row => row.count),
                    borderColor: 'rgba(75, 192, 192, 1)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Crime Trends Over Time'
                    }
                }
            }
        });

        new Chart(document.getElementById('nationalityChart'), {
            type: 'bar',
            data: {
                labels: nationalityData.map(row => row.nationality),
                datasets: [{
                    label: 'Crimes by Nationality',
                    data: nationalityData.map(row => row.count),
                    backgroundColor: 'rgba(153, 102, 255, 0.7)'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Crime Distribution by Nationality'
                    }
                }
            }
        });

        new Chart(document.getElementById('locationChart'), {
            type: 'bar',
            data: {
                labels: locationData.map(row => row.location),
                datasets: [{
                    label: 'Crimes by Location',
                    data: locationData.map(row => row.count),
                    backgroundColor: 'rgba(255, 159, 64, 0.7)'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Crime Distribution by Location'
                    }
                }
            }
        });
    </script>
</body>
</html>
